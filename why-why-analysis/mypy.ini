[mypy]
# 基本設定
# チェック対象とするPythonのバージョンを指定
python_version = 3.12

# 全体の型チェック設定 - 非常に緩和
# False: 型アノテーションがない関数やメソッドを許可
disallow_untyped_defs = False
# False: 一部の引数に型アノテーションがないことを許可
disallow_incomplete_defs = False
# True: 型情報がないモジュールのインポートエラーを無視
ignore_missing_imports = True
# skip: インポートされたモジュールの型チェックをスキップ
follow_imports = skip
# False: 戻り値の型がAnyであっても警告しない
warn_return_any = False
# False: 不要な# type: ignoreコメントでも警告しない
warn_unused_ignores = False
# False: Noneを含む型との比較操作を緩和する
strict_optional = False
# False: Any型のサブクラス化を許可
disallow_subclassing_any = False
# False: Anyを含むジェネリック型を許可
disallow_any_generics = False
# True: 同じ変数の再定義を許可
allow_redefinition = True
# False: 暗黙的なOptional[...]型を許可
no_implicit_optional = False
# False: 型アノテーションのない関数の呼び出しを許可
disallow_untyped_calls = False
# False: 型アノテーションのない関数の本体をチェックしない
check_untyped_defs = False

# 外部モジュールに対する設定
# グローバル設定と同じ値を設定する場合でも、特定モジュールに対する意図を明確にするために記述しています
# 各モジュールの型スタブがないため、型チェックをスキップ
[mypy-vertexai.*]
ignore_missing_imports = True
[mypy-vertexai.preview.*]
ignore_missing_imports = True
[mypy-vertexai.reasoning_engines.*]
ignore_missing_imports = True
[mypy-google.*]
ignore_missing_imports = True
[mypy-google.cloud.*]
ignore_missing_imports = True
[mypy-langgraph.*]
ignore_missing_imports = True

# プロジェクト内のモジュールに対する設定
# TODO: 一時的に各モジュールに対してignore_errors=Trueを設定し、型チェックエラーを完全に無視
[mypy-why_why_chat_ai.agent.dummy_agent]
# dummy_agentモジュールのすべての型チェックエラーを無視
ignore_errors = True
# 戻り値がない関数に対する警告を無視（このモジュール特有の設定）
warn_no_return = False

[mypy-why_why_chat_ai.interface]
# interfaceモジュールの型チェックエラーを無視（外部インターフェース関連）
ignore_errors = True

[mypy-why_why_chat_ai.agent.action]
# actionモジュールの型チェックエラーを無視（アクションビルダー関連）
ignore_errors = True

[mypy-why_why_chat_ai.agent.why_why_action]
# why_why_actionモジュールの型チェックエラーを無視（なぜなぜ分析アクション関連）
ignore_errors = True

[mypy-why_why_chat_ai.utils]
# utilsモジュールの型チェックエラーを無視（ユーティリティ関数関連）
ignore_errors = True

[mypy-why_why_chat_ai.agent.sample_agent]
# sample_agentモジュールの型チェックエラーを無視（サンプル実装関連）
ignore_errors = True

[mypy-why_why_chat_ai.api.app]
# appモジュールの型チェックエラーを無視（アプリメイン関連）
ignore_errors = True

[mypy-why_why_chat_ai.agent_builder]
# agent_builderモジュールの型チェックエラーを無視（エージェント構築関連）
ignore_errors = True

[mypy-tests.*]
# すべてのテストコードの型チェックエラーを無視（テストコードは本番コードより型チェックを緩和）
ignore_errors = True
