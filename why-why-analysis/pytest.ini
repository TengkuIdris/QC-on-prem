# pytest configuration

[pytest]
# テストマーカーの定義
markers =
    # 基本的なテスト分類
    unit: Unit tests that test individual components
    integration: Integration tests that may use mocks or real services
    e2e: End-to-end tests that test complete workflows
    
    # 環境依存マーカー
    mock_only: Tests that use only mocks (no external dependencies)
    requires_gcp: Tests that require real GCP services
    requires_db: Tests that require database connection
    requires_vertex_ai: Tests that require real Vertex AI API
    
    # 特殊なマーカー
    expensive: Tests that incur costs or take significant time
    vertex_ai_dev: Tests for Vertex AI dev environment (deprecated, use requires_vertex_ai)
    skip_in_ci: Tests that should be skipped in CI pipeline
    
    # パフォーマンス関連
    slow: Tests that take more than 5 seconds
    performance: Performance benchmark tests

# 非同期テストの設定
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# 環境変数ファイル（無効化 - conftest.pyで設定）
# env_files = .env.test

# テストパス
testpaths = tests

# 最小バージョン
minversion = 7.0

# 出力設定
addopts = 
    -v
    --strict-markers
    --tb=short
    --color=yes

# タイムアウト設定（オプション、pytest-timeoutが必要）
# timeout = 300

# カバレッジ設定（オプション、pytest-covが必要）
# --cov=why_why_chat_ai
# --cov-report=html
# --cov-report=term-missing

# 警告の設定
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning