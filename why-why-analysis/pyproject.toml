[project]
name = "why-why-chat-ai"
version = "0.1.0"
description = "なぜなぜ分析を支援するAIシステム"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "streamlit>=1.32.0",
    "langgraph>=0.0.36",
    "langchain>=0.1.11",
    "google-cloud-aiplatform[agent_engines,langchain]>=1.88.0",
    "langchain-google-community[vertexaisearch]>=2.0.2",
    "langchain-google-cloud-sql-pg>=0.13.0",
    "google-cloud-firestore>=2.13.0",
    "pydantic>=2.6.1",
    "streamlit-mermaid>=0.3.0",
    "loguru>=0.7.3",
    "python-dotenv>=1.0.1",
    "fastapi[all]>=0.115.12",
    "uvicorn[standard]>=0.34.2",
    "psycopg[binary,pool]>=3.1.0",
    "psycopg2-binary>=2.9.0",
    "langgraph-checkpoint-postgres>=2.0.21",
    "pydantic-settings>=2.0.0",
    "orjson>=3.10.15",
    "opentelemetry-sdk>=1.30.0",
    "opentelemetry-exporter-gcp-trace>=1.9.0",
    "starlette-context>=0.4.0",
    "slowapi>=0.1.9",
    "structlog>=25.3.0",
    "pyjwt>=2.10.0",
    "cryptography>=41.0.0",
    "ruff>=0.11.11",
    "pytest>=8.3.4",
    "httpx>=0.28.1",
    "coverage>=7.8.0",
    "aiohttp>=3.12.6",
    "testcontainers>=4.10.0",
    "alembic>=1.13.0",
    "opentelemetry-distro>=0.55b1",
    "opentelemetry-instrumentation-fastapi>=0.55b1",
    "opentelemetry-exporter-otlp>=1.34.1",
    "opentelemetry-exporter-gcp-monitoring>=1.9.0a0",
    "pytest-asyncio>=1.0.0",
    "requests>=2.32.3",
    "google-cloud-secret-manager>=2.24.0",
    "cloud-sql-python-connector[asyncpg,pg8000]>=1.0.0",
    "langchain-openai>=0.2.0",
]

[tool.setuptools.packages.find]
where = ["."]  # プロジェクトルートを検索対象とする
include = ["why_why_chat_ai*"]  # 'why_why_chat_ai' とそれに続くもの（サブパッケージなど）を含める
exclude = ["notebooks*", "terraform*"] # 'notebooks' と 'terraform' は除外する

[tool.pytest.ini_options]
markers = [
    "integration: mark test as integration test to skip in CI pipeline",
    "vertex_ai_dev: mark test as Vertex AI dev environment integration test",
    "requires_vertex_ai: mark test as requiring real Vertex AI API"
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# env_files = [".env.test"]  # 環境変数の自動読み込みを無効化

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.23.0",
    "grandalf>=0.8",
    "ipykernel>=6.29.5",
    "pytest-cov>=6.0.0",
    "pre-commit>=4.2.0",
    "mypy>=1.15.0",
    "pytest-dotenv>=0.5.2",
    "types-requests>=2.32.4.20250611",
]
